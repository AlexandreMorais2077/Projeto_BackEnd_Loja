{% extends "base.html" %}

{% block content %}
{% block title %}Produto{% endblock %}
    <h1>Produto</h1>
    <p>Complete o formulário para cadastrar um novo produto.</p>
    <form action="" method="post">
        <label for="name">Nome:</label><br>
        <input type="text" id="name" name="nome" required><br><br>
        <label for="descricao">Descrição:</label><br>
        <input type="description" id="descricao" name="descricao" required><br><br>
        <label for="preco">Preço:</label><br>
        <input type="price" id="preco" name="preco" step="0.01"><br><br>
        <label for="quantia">Quantia:</label><br>
        <input type="number" id="quantia" name="quantia" required><br><br>
        <input type="submit" value="Enviar">
    </form>

{% endblock %}
