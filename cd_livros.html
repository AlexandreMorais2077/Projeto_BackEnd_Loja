{% extends "base.html" %}

{% block title %}Cadastrar Livro{% endblock %}

{% block content %}
    <h1>Cadastrar Livro</h1>
    <p>Complete o formulário para cadastrar um novo livro.</p>
    <form action="" method="post">
        <label for="titulo">Título:</label><br>
        <input type="text" id="titulo" name="titulo" value="{{ livro.get('titulo', '') }}" maxlength="150" required><br><br>

        <label for="autor">Autor:</label><br>
        <input type="text" id="autor" name="autor" value="{{ livro.get('autor', '') }}" maxlength="100" required><br><br>

        <label for="isbn">ISBN:</label><br>
        <input type="text" id="isbn" name="isbn" value="{{ livro.get('isbn', '') }}" maxlength="20"><br><br>

        <label for="editora">Editora:</label><br>
        <input type="text" id="editora" name="editora" value="{{ livro.get('editora', '') }}" maxlength="100"><br><br>

        <label for="ano_publicacao">Ano de publicação:</label><br>
        <input type="number" id="ano_publicacao" name="ano_publicacao" value="{{ livro.get('ano_publicacao', '') }}" min="0"><br><br>

        <label for="quantidade">Quantidade:</label><br>
        <input type="number" id="quantidade" name="quantidade" value="{{ livro.get('quantidade', 1) }}" min="0" required><br><br>

        <input type="submit" value="Enviar">
        <a href="{{ url_for('livro.listar_livros') }}">Voltar</a>
    </form>
{% endblock %}
